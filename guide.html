<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1d23">
<title>艦これ 任務追蹤</title>
<style>
:root {
  --bg: #1a1d23;
  --panel: #252932;
  --panel-2: #2e3340;
  --border: #3a3f4d;
  --text: #e6e8eb;
  --text-dim: #9aa0ab;
  --accent: #5ea0ef;
  --done: #3a7d44;
  --done-dim: #2a5a32;
  --avail: #5ea0ef;
  --upcoming: #c89b3c;
  --note: #c89b3c;
  --type-sortie: #e05555;
  --type-exercise: #5ea0ef;
  --type-expedition: #4caf7d;
  --type-factory: #9c7cd4;
  --type-remodel: #e07b30;
  --type-formation: #9aa0ab;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.4;
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-tap-highlight-color: transparent;
}
header {
  position: sticky;
  top: 0;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: calc(10px + env(safe-area-inset-top)) 14px 8px;
  z-index: 10;
}
h1 {
  margin: 0 0 8px;
  font-size: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
}
h1 .progress {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: normal;
}
.view-switch {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
}
.view-switch button {
  flex: 1;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 8px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}
.view-switch button.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.sub-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 6px;
  padding: 2px 4px;
  background: rgba(94, 160, 239, 0.06);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.sub-tabs button {
  flex: 1;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  min-height: 32px;
}
.sub-tabs button.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
}
.controls input[type="search"] {
  flex: 1;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 16px;
  padding: 9px 12px;
  border-radius: 8px;
  -webkit-appearance: none;
}
.controls select {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 14px;
  padding: 9px 8px;
  border-radius: 8px;
}
.tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  margin: 4px -14px 0;
  padding: 2px 14px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.tab.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
main {
  padding: 8px 14px 80px;
}
.bucket {
  margin-bottom: 18px;
}
.bucket-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 4px 8px;
  font-size: 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 600;
}
.bucket-header .count {
  background: var(--panel-2);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
}
.bucket-header.done { color: var(--done); }
.bucket-header.avail { color: var(--avail); }
.bucket-header.upcoming { color: var(--upcoming); }
.bucket-header.pinned { color: #d76e8a; }
.bucket-header.recurring { color: #b89df0; }
.bucket-header.blocked { color: #e07b30; }
.goal-progress {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid #d76e8a;
  border-radius: 6px;
  padding: 10px 12px;
  margin: 0 4px 6px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.goal-progress:active { background: var(--panel-2); }
.goal-progress.achieved { border-left-color: var(--done); opacity: 0.75; }
.goal-progress-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
}
.goal-progress-name {
  font-size: 14px;
  color: var(--text);
  font-weight: 500;
}
.goal-progress-pct {
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
}
.goal-progress-bar {
  height: 5px;
  background: var(--panel-2);
  border-radius: 3px;
  overflow: hidden;
}
.goal-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #d76e8a, #5ea0ef);
  transition: width 0.3s ease;
}
.goal-progress.achieved .goal-progress-fill { background: var(--done); }
.bucket-empty {
  color: var(--text-dim);
  font-size: 13px;
  padding: 10px 12px;
  background: var(--panel);
  border: 1px dashed var(--border);
  border-radius: 8px;
  text-align: center;
}
.task {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  overflow: hidden;
}
.task.done { border-left-color: var(--done); opacity: 0.85; }
.task.avail { border-left-color: var(--avail); }
.task.upcoming { border-left-color: var(--upcoming); opacity: 0.9; }
.task.note {
  background: transparent;
  border: 1px dashed var(--border);
  opacity: 0.7;
}
.task.note .task-name { color: var(--note); font-style: italic; }
.task.note .check, .task.note .toggle { display: none; }
.task-row {
  display: flex;
  align-items: stretch;
  min-height: 46px;
}
.check {
  width: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
}
.check input {
  width: 22px;
  height: 22px;
  cursor: pointer;
  accent-color: var(--done);
}
.task-body {
  flex: 1;
  padding: 8px 4px 8px 0;
  min-width: 0;
}
.task-name {
  font-size: 14px;
  word-break: break-word;
  line-height: 1.3;
}
.task-name .id {
  color: var(--text-dim);
  font-size: 10px;
  margin-right: 5px;
  font-family: ui-monospace, monospace;
}
.task-meta {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 4px;
  font-size: 11px;
}
.tag {
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--panel-2);
  color: var(--text-dim);
  font-size: 10px;
}
.tag.cat { color: var(--text-dim); }
.tag.reward { color: var(--upcoming); border: 1px solid var(--upcoming); background: transparent; }
.tag.recurrence { color: #d76e8a; border: 1px solid #6e3a4a; background: transparent; }
/* 標籤系統：以底色區分意義（搜尋/篩選用，不參與分類） */
.tag.t-tag {
  border: 1px solid var(--border);
  background: rgba(94, 160, 239, 0.08);
  color: var(--text-dim);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
}
.tag.t-tag.t-monthly { color: #d76e8a; border-color: rgba(215,110,138,0.4); background: rgba(215,110,138,0.10); }
.tag.t-tag.t-yearly  { color: #c89b3c; border-color: rgba(200,155,60,0.45);  background: rgba(200,155,60,0.10); }
.tag.t-tag.t-weekly  { color: #5ea0ef; border-color: rgba(94,160,239,0.45);  background: rgba(94,160,239,0.10); }
.tag.t-tag.t-daily   { color: #4caf7d; border-color: rgba(76,175,125,0.45);  background: rgba(76,175,125,0.10); }
.tag.t-tag.t-rare    { color: #b89df0; border-color: rgba(156,124,212,0.5);  background: rgba(156,124,212,0.12); font-weight: 600; }
.tag.t-tag.t-fleet   { color: #ef9595; border-color: rgba(224,85,85,0.45);   background: rgba(224,85,85,0.10); }
.tag.t-tag.t-overseas{ color: #c89b3c; border-color: rgba(200,155,60,0.45);  background: transparent; }
.tag.t-tag.t-littorio{ color: #ef9595; border-color: rgba(224,85,85,0.55);   background: transparent; }
.tag.t-tag.t-z1      { color: #c89b3c; border-color: rgba(200,155,60,0.55);  background: transparent; }
.tag.t-tag.t-akashi  { color: #4caf7d; border-color: rgba(76,175,125,0.5);   background: rgba(76,175,125,0.10); }
.tag.t-tag.t-kashima { color: #d76e8a; border-color: rgba(215,110,138,0.5);  background: rgba(215,110,138,0.10); }
.tag.t-tag.t-uzuki   { color: #b89df0; border-color: rgba(156,124,212,0.45); background: rgba(156,124,212,0.10); }
.tag.t-tag.t-cycle   { color: #5ea0ef; border-color: rgba(94,160,239,0.4);   background: rgba(94,160,239,0.08); }
.tag.t-tag.t-reward  { color: var(--upcoming); border-color: var(--upcoming); background: transparent; }
.info-block {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 13px;
  color: var(--text);
  word-break: break-word;
  white-space: pre-line;
  line-height: 1.5;
}
.field.wiki-info.unlock label { color: #d76e8a; }
.field.wiki-info.content label { color: var(--avail); }
.field.wiki-info.reward_text label { color: var(--upcoming); }
.field.wiki-info.info-flow label { color: var(--text-dim); }
.field.wiki-info.info-flow .info-block {
  font-size: 12px;
  opacity: 0.85;
}
.tag.prereq { color: var(--text-dim); }
.tag.prereq.notdone { color: var(--upcoming); }
.toggle {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 16px;
  width: 36px;
  cursor: pointer;
  flex-shrink: 0;
  padding: 0;
}
.task.expanded .toggle { transform: rotate(180deg); }
.details {
  display: none;
  padding: 6px 12px 12px;
  border-top: 1px solid var(--border);
  background: var(--panel-2);
  font-size: 13px;
}
.task.expanded .details { display: block; }
.field { margin-top: 8px; }
.field label {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 3px;
}
.field textarea {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px;
  font-size: 13px;
  font-family: inherit;
  min-height: 50px;
  resize: vertical;
  -webkit-appearance: none;
}
.field .relbox {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.field .reltag {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.field .reltag.done { color: var(--done); border-color: var(--done-dim); }
.field .reltag .x {
  cursor: pointer;
  opacity: 0.6;
  font-weight: bold;
  padding: 0 2px;
}
.field .reltag .x:hover { opacity: 1; color: #ff6868; }
.field .reltag.linkable { cursor: pointer; }
.field .reltag.linkable:hover { background: var(--panel); }
.empty {
  text-align: center;
  color: var(--text-dim);
  padding: 32px 16px;
  font-size: 14px;
}
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 6px 14px calc(6px + env(safe-area-inset-bottom));
  background: var(--panel);
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 10;
}
.bottom-bar button {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
}
#btn-tray-toggle {
  /* Cog-only toggle: small, dim, right-aligned to avoid drawing attention. */
  align-self: flex-end;
  width: 44px;
  height: 32px;
  padding: 0;
  font-size: 14px;
  color: var(--text-dim);
  background: transparent;
  border: 1px dashed var(--border);
}
#btn-tray-toggle[aria-expanded="true"] {
  color: var(--accent);
  border-color: var(--accent);
  background: rgba(94, 160, 239, 0.08);
}
.bottom-tray {
  display: flex;
  gap: 6px;
  width: 100%;
}
.bottom-tray button { flex: 1; }
.bottom-tray .btn-danger {
  color: #e07b30;
  border-color: rgba(224, 123, 48, 0.5);
  background: rgba(224, 123, 48, 0.06);
}
.bottom-tray .btn-danger:active {
  background: rgba(224, 123, 48, 0.18);
}
dialog {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  max-width: 92vw;
  width: 380px;
  padding: 16px;
}
dialog::backdrop { background: rgba(0,0,0,0.6); }
dialog h2 { margin: 0 0 12px; font-size: 16px; }
dialog textarea, dialog input {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
  font-size: 13px;
  -webkit-appearance: none;
}
dialog textarea {
  height: 200px;
  font-family: ui-monospace, monospace;
  font-size: 11px;
}
dialog .actions { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }
dialog button {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
dialog button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.add-prereq-list {
  max-height: 300px;
  overflow-y: auto;
  margin-top: 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
}
.add-prereq-list .pick {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  font-size: 13px;
}
.add-prereq-list .pick:hover { background: var(--panel-2); }
.add-prereq-list .pick:last-child { border-bottom: none; }
mark { background: #f5d76e; color: #000; padding: 0 2px; border-radius: 2px; }
.type-badge {
  display: inline-block;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 10px;
  font-weight: 600;
  margin-right: 4px;
  vertical-align: middle;
  pointer-events: none;
  flex-shrink: 0;
  white-space: nowrap;
}
.type-badge.type-sortie { background: var(--type-sortie); color: #fff; }
.type-badge.type-exercise { background: var(--type-exercise); color: #fff; }
.type-badge.type-expedition { background: var(--type-expedition); color: #fff; }
.type-badge.type-factory { background: var(--type-factory); color: #fff; }
.type-badge.type-remodel { background: var(--type-remodel); color: #fff; }
.type-badge.type-formation { background: var(--type-formation); color: #1a1d23; }
.progress-bar-wrap {
  margin: 4px 0 2px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--done);
  border-radius: 2px;
  transition: width 0.15s ease;
  width: 0%;
  min-width: 0;
  max-width: 100%;
}
.bucket-header .count-progress {
  background: var(--panel-2);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
/* Stage C: Planner panel */
#planner {
  padding: 8px 14px 80px;
}
.planner-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.planner-label {
  font-size: 13px;
  color: var(--text-dim);
  white-space: nowrap;
}
#planner-select {
  flex: 1;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 13px;
  padding: 8px 10px;
  border-radius: 8px;
  min-width: 0;
  -webkit-appearance: none;
}
.planner-summary {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 10px;
  padding: 6px 10px;
  background: var(--panel);
  border-radius: 6px;
  border: 1px solid var(--border);
}
.planner-steps {
  list-style: none;
  margin: 0;
  padding: 0;
}
.planner-step {
  display: block;
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 8px;
  margin-bottom: 5px;
  font-size: 13px;
  overflow: hidden;
}
.planner-step-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  min-height: 44px;
}
.planner-step.done {
  opacity: 0.6;
  border-left-color: var(--done);
}
.planner-step.avail {
  border-left-color: var(--avail);
  background: rgba(94, 160, 239, 0.08);
}
.planner-step.upcoming {
  border-left-color: var(--upcoming);
  opacity: 0.85;
}
.planner-step.planner-target {
  border-left-color: var(--accent);
  background: rgba(94, 160, 239, 0.07);
  font-weight: 600;
}
.planner-step .toggle {
  margin-left: auto;
}
.planner-step.expanded .toggle { transform: rotate(180deg); }
.planner-step .details {
  display: none;
  padding: 6px 12px 12px;
  border-top: 1px solid var(--border);
  background: var(--panel-2);
  font-size: 13px;
}
.planner-step.expanded .details { display: block; }
.planner-check {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  cursor: pointer;
}
.planner-check input {
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--done);
}
.planner-check.readonly { cursor: help; }
.planner-check.readonly input { cursor: help; opacity: 0.7; }
.step-icon { flex-shrink: 0; }
.step-id {
  color: var(--text-dim);
  font-size: 10px;
  font-family: ui-monospace, monospace;
  flex-shrink: 0;
}
.step-name {
  flex: 1;
  min-width: 0;
  word-break: break-word;
  line-height: 1.3;
}
.step-name s { opacity: 0.55; }
.planner-start-hint {
  color: var(--avail);
  font-size: 11px;
  flex-shrink: 0;
  white-space: nowrap;
}
.planner-msg {
  text-align: center;
  padding: 24px 16px;
  font-size: 14px;
  color: var(--text-dim);
  border: 1px dashed var(--border);
  border-radius: 8px;
}
.planner-msg.done-msg { color: var(--done); border-color: var(--done); }
/* 釘選目標 + 熱門目標 chips */
.planner-pins:empty { display: none; }
.planner-pins-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
}
.planner-pins-row:last-child { margin-bottom: 10px; }
.planner-pins-label {
  font-size: 11px;
  color: var(--text-dim);
  flex-shrink: 0;
  padding-right: 2px;
}
.planner-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 9px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  min-height: 36px;
  line-height: 1.25;
  max-width: 100%;
  word-break: break-word;
  transition: background 0.1s;
}
.planner-chip:active { background: var(--panel-2); }
.planner-chip.pinned {
  border-color: rgba(94, 160, 239, 0.55);
  color: var(--accent);
}
.planner-chip.hot {
  border-color: rgba(224, 85, 85, 0.45);
  color: #e9897a;
}
.planner-chip.active {
  background: rgba(94, 160, 239, 0.18);

const STORAGE_KEY = 'kc_quest_state_v2';

// 規劃器熱門目標（最常被當成路線終點的 reward / task 節點）
const HOT_GOALS = ['t069', 't070', 't118', 't087', 't124', 't102', 't086', 't129'];

const TASKS_BY_ID = Object.fromEntries(TASKS.map(t => [t.id, t]));
const REAL_TASKS = TASKS.filter(t => t.kind === 'task');

const state = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    return {
      done: s.done || {},
      notes: s.notes || {},
      prevAdd: s.prevAdd || {},
      prevRemove: s.prevRemove || {},
      recentLimit: s.recentLimit || 8,
      pinnedGoals: Array.isArray(s.pinnedGoals) ? s.pinnedGoals.filter(id => id) : [],
    };
  } catch { return { done: {}, notes: {}, prevAdd: {}, prevRemove: {}, recentLimit: 8, pinnedGoals: [] }; }
})();

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function effPrereqs(t) {
  const base = new Set(t.prev || []);
  (state.prevAdd[t.id] || []).forEach(x => base.add(x));
  (state.prevRemove[t.id] || []).forEach(x => base.delete(x));
  return [...base];
}

function isAvailable(t) {
  if (state.done[t.id]) return false;
  return effPrereqs(t).every(pid => state.done[pid]);
}

function computeBuckets() {
  const available = REAL_TASKS.filter(isAvailable);
  const availSet = new Set(available.map(t => t.id));

  // 剛完成: direct upstream prereqs of available tasks (already done)
  const upstreamIds = new Set();
  available.forEach(a => effPrereqs(a).forEach(pid => {
    if (state.done[pid]) upstreamIds.add(pid);
  }));
  const recentDone = [...upstreamIds]
    .map(id => TASKS_BY_ID[id])
    .filter(t => t && t.kind === 'task')
    .sort((a, b) => (state.done[b.id] || 0) - (state.done[a.id] || 0));

  // 預計解鎖: direct downstream of available tasks (not done, not yet available)
  const downstreamIds = new Set();
  available.forEach(a => (a.next || []).forEach(nid => {
    if (!state.done[nid] && !availSet.has(nid)) downstreamIds.add(nid);
  }));
  const upcoming = [...downstreamIds]
    .map(id => TASKS_BY_ID[id])
    .filter(t => t && t.kind === 'task');

  return { recentDone, available, upcoming };
}

function highlight(text, query) {
  if (!query) return text;
  const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  return text.replace(re, m => `<mark>${m}</mark>`);
}

function makeBucket(title, kind, items, opts = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'bucket';
  const head = document.createElement('div');
  head.className = 'bucket-header ' + kind;
  const titleSpan = document.createElement('span');
  titleSpan.textContent = title + (opts.subtitle ? ` · ${opts.subtitle}` : '');
  head.appendChild(titleSpan);
  const cnt = document.createElement('span');
  cnt.className = 'count';
  cnt.textContent = items.length;
  head.appendChild(cnt);
  wrap.appendChild(head);
  if (items.length === 0) {
    const e = document.createElement('div');
    e.className = 'bucket-empty';
    e.textContent = opts.emptyText || '(目前無)';
    wrap.appendChild(e);
  } else {
    items.forEach(t => wrap.appendChild(renderTask(t, '', kind)));
  }
  return wrap;
}

function renderFocus() {
  const { recentDone, available, upcoming } = computeBuckets();

  // === 1. 釘選目標進度 ===
  const pinned = (Array.isArray(state.pinnedGoals) ? state.pinnedGoals : []).filter(id => TASKS_BY_ID[id]);
  if (pinned.length) {
    const wrap = document.createElement('div');
    wrap.className = 'bucket';
    const head = document.createElement('div');
    head.className = 'bucket-header pinned';
    head.innerHTML = `<span>📌 釘選目標進度</span><span class="count">${pinned.length}</span>`;
    wrap.appendChild(head);
    pinned.forEach(id => {
      const t = TASKS_BY_ID[id];
      if (!t) return;
      const ancestors = buildAncestors(id);
      const taskAncestors = [...ancestors].filter(aid => {
        const at = TASKS_BY_ID[aid];
        return at && at.kind === 'task';
      });
      const total = taskAncestors.length;
      const rawDone = taskAncestors.filter(aid => state.done[aid]).length;
      const achieved = isTargetAchieved(id);
      // When the goal is achieved (e.g. reward target's granting task is done, or
      // the target task itself is checked), force the bar full. This keeps the focus
      // view consistent with the planner, which short-circuits to "目標已達成" on the
      // same condition rather than tallying every ancestor.
      const done = achieved ? total : rawDone;
      const pct = total > 0 ? Math.round((done / total) * 100) : (achieved ? 100 : 0);
      const row = document.createElement('div');
      row.className = 'goal-progress' + (achieved ? ' achieved' : '');
      const escName = String(t.name).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
      row.innerHTML =
        '<div class="goal-progress-head">' +
          '<span class="goal-progress-name">' + (achieved ? '✅ ' : '') + escName + '</span>' +
          '<span class="goal-progress-pct">' + done + '/' + total + ' · ' + pct + '%</span>' +
        '</div>' +
        '<div class="goal-progress-bar"><div class="goal-progress-fill" style="width:' + pct + '%"></div></div>';
      row.onclick = () => {
        viewMode = 'planner';
        if (ui.plannerSelect) ui.plannerSelect.value = id;
        setView();
        render();
      };
      wrap.appendChild(row);
    });
    ui.list.appendChild(wrap);
  }

  // === Split available into sub-buckets ===
  const recurringAvail = [];
  const shipBlocked = [];
  const otherAvail = [];
  available.forEach(t => {
    const tags = taskTags(t);
    const isRecurring = tags.includes('daily') || tags.includes('weekly') ||
                        tags.includes('monthly') || tags.includes('yearly');
    const missing = missingShipsFor(t);
    if (missing.length > 0) {
      shipBlocked.push(t);
    } else if (isRecurring) {
      recurringAvail.push(t);
    } else {
      otherAvail.push(t);
    }
  });

  // === 2. 重複任務 (daily/weekly/monthly/yearly available) ===
  if (recurringAvail.length) {
    const wrap = document.createElement('div');
    wrap.className = 'bucket';
    const head = document.createElement('div');
    head.className = 'bucket-header recurring';
    head.innerHTML = '<span>🔁 重複任務(立即可進行)</span><span class="count">' + recurringAvail.length + '</span>';
    wrap.appendChild(head);
    recurringAvail.forEach(t => wrap.appendChild(renderTask(t, '', 'avail')));
    ui.list.appendChild(wrap);
  }

  // === 3. 進行中(可解鎖) ===
  ui.list.appendChild(makeBucket('▶ 進行中(可解鎖)', 'avail', otherAvail, {
    emptyText: '沒有可立即進行的任務'
  }));

  // === 4. 缺艦娘卡關 ===
  if (shipBlocked.length) {
    const wrap = document.createElement('div');
    wrap.className = 'bucket';
    const head = document.createElement('div');
    head.className = 'bucket-header blocked';
    head.innerHTML = '<span>🚫 缺艦娘卡關</span><span class="count">' + shipBlocked.length + '</span>';
    wrap.appendChild(head);
    shipBlocked.forEach(t => wrap.appendChild(renderTask(t, '', 'avail')));
    ui.list.appendChild(wrap);
  }

  // === 5. 預計解鎖 ===
  ui.list.appendChild(makeBucket('📍 預計解鎖', 'upcoming', upcoming, {
    emptyText: '進行中的任務沒有後續任務'
  }));

  // === 6. 剛完成 (放最後，少干擾) ===
  const limit = state.recentLimit;
  const recentShown = recentDone.slice(0, limit);
  const recentBucket = makeBucket('✓ 剛完成', 'done', recentShown, {
    subtitle: recentDone.length > limit ? '最近 ' + limit + ' / 共 ' + recentDone.length : null,
    emptyText: '尚未勾選任何任務'
  });
  if (recentDone.length > limit) {
    const more = document.createElement('button');
    more.className = 'tab';
    more.style.cssText = 'margin: 6px 4px 0; padding: 6px 12px;';
    more.textContent = '顯示更多已完成 (+' + Math.min(8, recentDone.length - limit) + ')';
    more.onclick = () => { state.recentLimit += 8; save(); render(); };
    recentBucket.appendChild(more);
  }
  ui.list.appendChild(recentBucket);
}

function renderAll() {
  const query = ui.search.value.trim();
  const filterVal = ui.filter.value;

  const catStats = {};
  REAL_TASKS.forEach(t => {
    if (!catStats[t.cat]) catStats[t.cat] = { done: 0, total: 0 };
    catStats[t.cat].total++;
    if (state.done[t.id]) catStats[t.cat].done++;
  });

  let visible = TASKS.filter(t => {
    if (t.kind === 'reward') return false;
    if (activeCategory !== 'all' && t.cat !== activeCategory) return false;
    if (currentTypeFilter !== 'all') {
      if (t.kind !== 'task' || t.type !== currentTypeFilter) return false;
    }
    if (activeTag !== 'all') {
      if (t.kind !== 'task' || !taskTags(t).includes(activeTag)) return false;
    }
    if (query) {
      const blob = (
        t.id + ' ' + t.name + ' ' +
        (t.cat || '') + ' ' +
        taskTags(t).join(' ') + ' ' +
        (t.recurrence || '') + ' ' +
        (t.rewards || []).join(' ') + ' ' +
        (t.require_ships || []).join(' ') + ' ' +
        (t.content || '') + ' ' + (t.unlock || '') + ' ' + (t.reward_text || '') + ' ' +
        JSON.stringify(state.notes[t.id] || {})
      ).toLowerCase();
      if (!blob.includes(query.toLowerCase())) return false;
    }
    if (t.kind === 'task') {
      if (filterVal === 'todo' && state.done[t.id]) return false;
      if (filterVal === 'done' && !state.done[t.id]) return false;
    } else {
      if (filterVal !== 'all') return false;
    }
    return true;
  });

  if (visible.length === 0) {
    ui.list.innerHTML = '<div class="empty">沒有符合的項目</div>';
    return;
  }

  const byCat = {};
  visible.forEach(t => { (byCat[t.cat] = byCat[t.cat] || []).push(t); });
  Object.entries(byCat).forEach(([cat, items]) => {
    const h = document.createElement('div');
    h.className = 'bucket-header';
    const stats = catStats[cat] || { done: 0, total: 0 };
    h.innerHTML = `<span>${cat}</span><span class="count-progress">${stats.done} / ${stats.total}</span>`;
    ui.list.appendChild(h);
    items.forEach(t => ui.list.appendChild(renderTask(t, query, t.kind === 'note' ? 'note' : (state.done[t.id] ? 'done' : ''))));
  });
}

// Ship-requirement helpers used by task card rendering
function missingShipsFor(t) {
  if (!t) return [];
  if (typeof shipsState === 'undefined') return [];
  const hasReq = Array.isArray(t.require_ships) && t.require_ships.length;
  const hasStrict = Array.isArray(t.require_strict_forms) && t.require_strict_forms.length;
  if (!hasReq && !hasStrict) return [];
  const missing = [];
  if (hasReq) {
    t.require_ships.forEach(name => {
      const base = shipBaseFromName(name);
      if (!base) { missing.push(name); return; }
      if (!shipsState.owned[base]) missing.push(name);
    });
  }
  if (hasStrict) {
    t.require_strict_forms.forEach(form => {
      // 嚴格指定特定型態，必須在 ownedForms 中標記
      if (!shipsState.ownedForms[form]) missing.push(form);
    });
  }
  return missing;
}

function renderTask(t, query, kindClass) {
  const el = document.createElement('div');
  const missingShips = (t.kind === 'task' && !state.done[t.id]) ? missingShipsFor(t) : [];
  const blocked = missingShips.length > 0;
  el.className = 'task ' + (kindClass || '') + (t.kind === 'note' ? ' note' : '') + (blocked ? ' ship-blocked' : '');
  el.dataset.id = t.id;

  const row = document.createElement('div');
  row.className = 'task-row';

  if (t.kind === 'task') {
    const ck = document.createElement('label');
    ck.className = 'check';
    ck.onclick = (e) => e.stopPropagation();
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !!state.done[t.id];
    input.onchange = () => {
      if (input.checked) state.done[t.id] = Date.now();
      else delete state.done[t.id];
      save();
      render();
    };
    ck.appendChild(input);
    row.appendChild(ck);
  }

  const body = document.createElement('div');
  body.className = 'task-body';
  const nameEl = document.createElement('div');
  nameEl.className = 'task-name';
  if (t.kind === 'task' && t.type) {
    const badge = document.createElement('span');
    badge.className = 'type-badge type-' + t.type;
    badge.textContent = TYPE_LABELS[t.type] || t.type;
    nameEl.appendChild(badge);
  }
  nameEl.insertAdjacentHTML('beforeend', `<span class="id">${t.id}</span>${highlight(t.name, query)}`);
  body.appendChild(nameEl);

  const meta = document.createElement('div');
  meta.className = 'task-meta';
  if (t.kind === 'task') {
    const catTag = document.createElement('span');
    catTag.className = 'tag cat';
    catTag.textContent = t.cat;
    meta.appendChild(catTag);
    if (t.recurrence) {
      const recTag = document.createElement('span');
      recTag.className = 'tag recurrence';
      const labels = { monthly: '月', yearly: '年', weekly: '週', daily: '日' };
      recTag.textContent = labels[t.recurrence] || t.recurrence;
      meta.appendChild(recTag);
    }
    // 額外標籤：搜尋/篩選用
    taskTags(t).forEach(tg => {
      const cls = TAG_CSS[tg] || '';
      const span = document.createElement('span');
      span.className = 'tag t-tag ' + cls;
      span.textContent = TAG_ICONS[tg] || tg;
      span.title = '點擊以此標籤篩選';
      span.style.cursor = 'pointer';
      span.onclick = (e) => {
        e.stopPropagation();
        if (viewMode !== 'all') { viewMode = 'all'; setView(); }
        activeTag = (activeTag === tg) ? 'all' : tg;
        renderTagTabs();
        render();
      };
      meta.appendChild(span);
    });
    if (t.rewards && t.rewards.length) {
      t.rewards.forEach(r => {
        const tag = document.createElement('span');
        tag.className = 'tag reward';
        tag.textContent = '🎁 ' + r;
        meta.appendChild(tag);
      });
    }
    // Show prereq context for upcoming tasks
    if (kindClass === 'upcoming') {
      const prereqs = effPrereqs(t).filter(pid => !state.done[pid]);
      prereqs.forEach(pid => {
        const ptask = TASKS_BY_ID[pid];
        if (!ptask) return;
        const tag = document.createElement('span');
        tag.className = 'tag prereq notdone';
        tag.textContent = '前置: ' + (ptask.name.length > 18 ? ptask.name.slice(0, 18) + '…' : ptask.name);
        meta.appendChild(tag);
      });
    }
  }
  if (meta.children.length) body.appendChild(meta);
  row.appendChild(body);

  if (t.kind === 'task') {
    const tg = document.createElement('button');
    tg.className = 'toggle';
    tg.textContent = '▾';
    tg.onclick = (e) => { e.stopPropagation(); el.classList.toggle('expanded'); };
    row.appendChild(tg);
  }

  el.appendChild(row);

  if (kindClass === 'upcoming' && t.kind === 'task') {
    const undone = effPrereqs(t).filter(pid => {
      const pt = TASKS_BY_ID[pid];
      return pt && pt.kind === 'task' && !state.done[pid];
    });
    if (undone.length > 0) {
      const badgesDiv = document.createElement('div');
      badgesDiv.className = 'prereq-badges';
      undone.slice(0, 3).forEach(pid => {
        const ptask = TASKS_BY_ID[pid];
        const badge = document.createElement('span');
        badge.className = 'prereq-badge';
        const nm = ptask.name.length > 20 ? ptask.name.slice(0, 20) + '…' : ptask.name;
        badge.textContent = '🔒 ' + nm;
        badge.onclick = (e) => { e.stopPropagation(); scrollToTaskFlash(pid); };
        badgesDiv.appendChild(badge);
      });
      if (undone.length > 3) {
        const more = document.createElement('span');
        more.className = 'prereq-more';
        more.textContent = `+${undone.length - 3} 個前置`;
        badgesDiv.appendChild(more);
      }
      const jumpLink = document.createElement('span');
      jumpLink.className = 'planner-jump';
      jumpLink.textContent = '📋 查看完整路線';
      jumpLink.onclick = (e) => {
        e.stopPropagation();
        viewMode = 'planner';
        setView();
        ui.plannerSelect.value = t.id;
        render();
      };
      badgesDiv.appendChild(jumpLink);
      el.appendChild(badgesDiv);
    }
  }

  // Ship requirement warning list (always shown when blocked)
  if (blocked) {
    const warnDiv = document.createElement('div');
    warnDiv.className = 'ship-warning-list';
    missingShips.slice(0, 8).forEach(name => {
      const w = document.createElement('span');
      w.className = 'ship-warning';
      w.textContent = '⚠ ' + name;
      w.onclick = (e) => {
        e.stopPropagation();
        viewMode = 'ships';
        setView();
        shipsSearch = name;
        const sb = document.getElementById('ships-search');
        if (sb) sb.value = name;
        renderShipsPanel();
      };
      warnDiv.appendChild(w);
    });
    if (missingShips.length > 8) {
      const more = document.createElement('span');
      more.className = 'ship-warning';
      more.textContent = `+${missingShips.length - 8}`;
      warnDiv.appendChild(more);
    }
    el.appendChild(warnDiv);
  }

  if (t.kind === 'task') {
    const det = document.createElement('div');
    det.className = 'details';
    det.appendChild(makeWikiInfo(t));
    det.appendChild(makePrereqEditor(t));
    det.appendChild(makeNextList(t));
    det.appendChild(makeNotesEditor(t));
    el.appendChild(det);
  }

  return el;
}

function makeWikiInfo(t) {
  const frag = document.createDocumentFragment();
  const flowInfo = (t.info || []).join('\n');
  const sections = [
    ['unlock', '開放条件', t.unlock],
    ['content', '任務內容', t.content],
    ['reward_text', '報酬', t.reward_text],
    ['info-flow', '流程圖摘要', flowInfo],
  ];
  sections.forEach(([cls, label, value]) => {
    if (!value) return;
    const wrap = document.createElement('div');
    wrap.className = 'field wiki-info ' + cls;
    const lbl = document.createElement('label');
    lbl.textContent = label;
    wrap.appendChild(lbl);
    const div = document.createElement('div');
    div.className = 'info-block';
    div.textContent = value;
    wrap.appendChild(div);
    frag.appendChild(wrap);
  });
  return frag;
}

function makePrereqEditor(t) {
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const label = document.createElement('label');
  label.textContent = '前置任務(可手動修正)';
  wrap.appendChild(label);
  const box = document.createElement('div');
  box.className = 'relbox';
  effPrereqs(t).forEach(pid => {
    const ptask = TASKS_BY_ID[pid];
    if (!ptask) return;
    const tag = document.createElement('span');
    tag.className = 'reltag linkable' + (state.done[pid] ? ' done' : '');
    tag.textContent = ptask.name.length > 22 ? ptask.name.slice(0, 22) + '…' : ptask.name;
    tag.onclick = () => scrollToTask(pid);
    const x = document.createElement('span');
    x.className = 'x';
    x.textContent = '×';
    x.title = '移除這個前置';
    x.onclick = (e) => {
      e.stopPropagation();
      state.prevRemove[t.id] = state.prevRemove[t.id] || [];
      if (!state.prevRemove[t.id].includes(pid)) state.prevRemove[t.id].push(pid);
      const addArr = state.prevAdd[t.id];
      if (addArr) state.prevAdd[t.id] = addArr.filter(x => x !== pid);
      save(); render();
    };
    tag.appendChild(x);
    box.appendChild(tag);
  });
  const addBtn = document.createElement('span');
  addBtn.className = 'reltag linkable';
  addBtn.textContent = '+ 新增前置';
  addBtn.onclick = () => openPrereqPicker(t.id);
  box.appendChild(addBtn);
  wrap.appendChild(box);
  return wrap;
}

function makeNextList(t) {
  const next = (t.next || []).filter(nid => TASKS_BY_ID[nid]);
  if (next.length === 0) return document.createTextNode('');
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const label = document.createElement('label');
  label.textContent = '解鎖後續';
  wrap.appendChild(label);
  const box = document.createElement('div');
  box.className = 'relbox';
  next.forEach(nid => {
    const ntask = TASKS_BY_ID[nid];
    const tag = document.createElement('span');
    tag.className = 'reltag linkable' + (state.done[nid] ? ' done' : '');
    tag.textContent = ntask.name.length > 22 ? ntask.name.slice(0, 22) + '…' : ntask.name;
    tag.onclick = () => scrollToTask(nid);
    box.appendChild(tag);
  });
  wrap.appendChild(box);
  return wrap;
}

function makeNotesEditor(t) {
  const frag = document.createDocumentFragment();
  const fields = [
    ['cond', '條件 / 達成方法'],
    ['note', '備註'],
  ];
  const note = state.notes[t.id] || {};
  fields.forEach(([key, lbl]) => {
    const f = document.createElement('div');
    f.className = 'field';
    f.innerHTML = `<label>${lbl}</label><textarea data-field="${key}"></textarea>`;
    const ta = f.querySelector('textarea');
    ta.value = note[key] || '';
    ta.addEventListener('input', () => {
      if (!state.notes[t.id]) state.notes[t.id] = {};
      state.notes[t.id][key] = ta.value;
      if (!ta.value) delete state.notes[t.id][key];
      if (Object.keys(state.notes[t.id]).length === 0) delete state.notes[t.id];
      save();
    });
    frag.appendChild(f);
  });
  return frag;
}

function scrollToTask(id) {
  viewMode = 'all';
  setView();
  render();
  setTimeout(() => {
    const el = document.querySelector(`.task[data-id="${id}"]`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('expanded');
    }
  }, 50);
}

function scrollToTaskFlash(id) {
  viewMode = 'all';
  setView();
  render();
  setTimeout(() => {
    const el = document.querySelector(`.task[data-id="${id}"]`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1900);
    }
  }, 50);
}

function openPrereqPicker(taskId) {
  const dlg = document.getElementById('dlg');
  document.getElementById('dlg-title').textContent = '選擇要新增的前置任務';
  const body = document.getElementById('dlg-body');
  body.innerHTML = '<input type="search" id="picker-search" placeholder="搜尋任務..."><div class="add-prereq-list" id="picker-list"></div>';
  const search = body.querySelector('#picker-search');
  const list = body.querySelector('#picker-list');
  const current = new Set(effPrereqs(TASKS_BY_ID[taskId]));
  current.add(taskId);

  function renderPicker() {
    const q = search.value.toLowerCase();
    list.innerHTML = '';
    REAL_TASKS.filter(t => !current.has(t.id) && (!q || t.name.toLowerCase().includes(q))).slice(0, 50).forEach(t => {
      const div = document.createElement('div');
      div.className = 'pick';
      div.textContent = `[${t.cat}] ${t.name}`;
      div.onclick = () => {
        state.prevAdd[taskId] = state.prevAdd[taskId] || [];
        if (!state.prevAdd[taskId].includes(t.id)) state.prevAdd[taskId].push(t.id);
        const remArr = state.prevRemove[taskId];
        if (remArr) state.prevRemove[taskId] = remArr.filter(x => x !== t.id);
        save();
        dlg.close();
        render();
      };
      list.appendChild(div);
    });
  }
  search.addEventListener('input', renderPicker);
  renderPicker();
  document.getElementById('dlg-ok').style.display = 'none';
  document.getElementById('dlg-cancel').textContent = '關閉';
  dlg.showModal();
}

function buildAncestors(targetId) {
  const target = TASKS_BY_ID[targetId];
  if (!target) return new Set();
  const visited = new Set();
  const queue = [];

  function enqueue(id) {
    if (!visited.has(id)) { visited.add(id); queue.push(id); }
  }

  enqueue(targetId);
  // reward nodes have no prev edges; find tasks that grant this reward by name
  if (target.kind === 'reward') {
    TASKS.forEach(t => {
      if (t.kind === 'task' && (t.rewards || []).includes(target.name)) enqueue(t.id);
    });
  }

  while (queue.length) {
    const id = queue.shift();
    const t = TASKS_BY_ID[id];
    if (!t || t.kind === 'reward') continue;
    effPrereqs(t).forEach(pid => enqueue(pid));
  }
  return visited;
}

function topoSort(nodeSet) {
  const taskNodes = [...nodeSet].filter(id => {
    const t = TASKS_BY_ID[id];
    return t && t.kind !== 'reward';
  });
  const rewardNodes = [...nodeSet].filter(id => {
    const t = TASKS_BY_ID[id];
    return t && t.kind === 'reward';
  });

  const inDeg = {};
  taskNodes.forEach(id => { inDeg[id] = 0; });
  taskNodes.forEach(id => {
    const t = TASKS_BY_ID[id];
    if (!t) return;
    effPrereqs(t).forEach(pid => { if (pid in inDeg) inDeg[id]++; });
  });

  const queue = taskNodes.filter(id => inDeg[id] === 0);
  const result = [];
  while (queue.length) {
    const id = queue.shift();
    result.push(id);
    taskNodes.forEach(nid => {
      const nt = TASKS_BY_ID[nid];
      if (!nt) return;
      if (effPrereqs(nt).includes(id)) {
        inDeg[nid]--;
        if (inDeg[nid] === 0) queue.push(nid);
      }
    });
  }
  const resultSet = new Set(result);
  taskNodes.forEach(id => { if (!resultSet.has(id)) result.push(id); });
  return [...result, ...rewardNodes];
}

function plannerStepStatus(taskId, ancestorSet) {
  const t = TASKS_BY_ID[taskId];
  if (!t || t.kind !== 'task') return null;
  if (state.done[taskId]) return 'done';
  const blocked = effPrereqs(t).some(pid => {
    const pt = TASKS_BY_ID[pid];
    if (!pt || pt.kind === 'note') return false;
    if (!ancestorSet.has(pid)) return false;
    return !state.done[pid];
  });
  return blocked ? 'upcoming' : 'avail';
}

function isTargetAchieved(targetId) {
  const t = TASKS_BY_ID[targetId];
  if (!t) return false;
  if (t.kind === 'task') return !!state.done[targetId];
  if (t.kind === 'reward') {
    const grantors = TASKS.filter(gt => gt.kind === 'task' && (gt.rewards || []).includes(t.name));
    return grantors.length > 0 && grantors.every(gt => state.done[gt.id]);
  }
  return false;
}

function renderPlannerPins() {
  if (!ui.plannerPins) return;
  const targetId = ui.plannerSelect.value;
  const pinnedRaw = Array.isArray(state.pinnedGoals) ? state.pinnedGoals : [];
  const pinned = pinnedRaw.filter(id => TASKS_BY_ID[id]);
  const pinnedSet = new Set(pinned);
  const hot = HOT_GOALS.filter(id => TASKS_BY_ID[id] && !pinnedSet.has(id));

  const escape = s => String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));

  const parts = [];
  if (pinned.length) {
    parts.push('<div class="planner-pins-row">');
    parts.push('<span class="planner-pins-label">📌 釘選</span>');
    pinned.forEach(id => {
      const t = TASKS_BY_ID[id];
      const achieved = isTargetAchieved(id);
      let cls = 'planner-chip pinned';
      if (id === targetId) cls += ' active';
      if (achieved) cls += ' achieved';
      parts.push(
        `<span class="${cls}" data-pick="${id}">` +
          `<span class="planner-chip-id">${id}</span>` +
          `<span>${escape(t.name)}</span>` +
          `<span class="planner-chip-x" data-unpin="${id}" title="取消釘選">✕</span>` +
        '</span>'
      );
    });
    parts.push('</div>');
  }
  if (hot.length) {
    parts.push('<div class="planner-pins-row">');
    parts.push('<span class="planner-pins-label">🔥 熱門</span>');
    hot.forEach(id => {
      const t = TASKS_BY_ID[id];
      const achieved = isTargetAchieved(id);
      let cls = 'planner-chip hot';
      if (id === targetId) cls += ' active';
      if (achieved) cls += ' achieved';
      parts.push(
        `<span class="${cls}" data-pick="${id}">` +
          `<span class="planner-chip-id">${id}</span>` +
          `<span>${escape(t.name)}</span>` +
        '</span>'
      );
    });
    parts.push('</div>');
  }
  ui.plannerPins.innerHTML = parts.join('');

  // 釘選按鈕高亮
  if (ui.plannerPinBtn) {
    if (!targetId) {
      ui.plannerPinBtn.classList.remove('active');
      ui.plannerPinBtn.disabled = true;
      ui.plannerPinBtn.title = '請先選擇目標';
    } else {
      ui.plannerPinBtn.disabled = false;
      if (pinnedSet.has(targetId)) {
        ui.plannerPinBtn.classList.add('active');
        ui.plannerPinBtn.title = '取消釘選此目標';
      } else {
        ui.plannerPinBtn.classList.remove('active');
        ui.plannerPinBtn.title = '釘選此目標';
      }
    }
  }
}

function togglePinGoal(id) {
  if (!id || !TASKS_BY_ID[id]) return;
  if (!Array.isArray(state.pinnedGoals)) state.pinnedGoals = [];
  const idx = state.pinnedGoals.indexOf(id);
  if (idx >= 0) state.pinnedGoals.splice(idx, 1);
  else state.pinnedGoals.push(id);
  save();
}

function renderPlanner() {
  renderPlannerPins();
  const targetId = ui.plannerSelect.value;
  if (!targetId) {
    ui.plannerBody.innerHTML = '<div class="planner-msg">請選擇目標任務</div>';
    return;
  }
  if (isTargetAchieved(targetId)) {
    ui.plannerBody.innerHTML = '<div class="planner-msg done-msg">✅ 目標已達成</div>';
    return;
  }

  const ancestorSet = buildAncestors(targetId);
  const sorted = topoSort(ancestorSet);
  const displayNodes = sorted.filter(id => {
    const t = TASKS_BY_ID[id];
    return t && t.kind !== 'note';
  });

  const incompleteCount = displayNodes.filter(id => {
    const t = TASKS_BY_ID[id];
    return t && t.kind === 'task' && !state.done[id];
  }).length;

  ui.plannerBody.innerHTML = '';
  const summary = document.createElement('div');
  summary.className = 'planner-summary';
  summary.textContent = `建議完成順序（還差 ${incompleteCount} 步）`;
  ui.plannerBody.appendChild(summary);

  const ol = document.createElement('ol');
  ol.className = 'planner-steps';

  let firstAvail = true;
  displayNodes.forEach(id => {
    const t = TASKS_BY_ID[id];
    if (!t) return;
    const isDone = !!state.done[id];
    const isTarget = id === targetId;

    let icon, cls, isFirstAvail = false;
    if (t.kind === 'reward') {
      icon = '🎁'; cls = 'planner-step planner-target';
    } else {
      const status = plannerStepStatus(id, ancestorSet);
      if (status === 'done') {
        icon = '✅'; cls = 'planner-step done';
      } else if (status === 'avail') {
        icon = '🔵'; cls = 'planner-step avail';
        if (firstAvail) { firstAvail = false; isFirstAvail = true; }
      } else {
        icon = '🟡'; cls = 'planner-step upcoming';
      }
      if (isTarget) cls += ' planner-target';
    }

    const li = document.createElement('li');
    li.className = cls;
    li.dataset.id = id;

    const headerRow = document.createElement('div');
    headerRow.className = 'planner-step-row';

    // Checkbox first (consistent layout for both task and reward nodes)
    const ck = document.createElement('label');
    ck.className = 'planner-check';
    ck.onclick = e => e.stopPropagation();
    const inp = document.createElement('input');
    inp.type = 'checkbox';
    inp.dataset.id = id;
    if (t.kind === 'task') {
      inp.checked = isDone;
    } else {
      // reward 節點: 依據授予任務狀態自動勾選, 不可手動切換
      inp.checked = isTargetAchieved(id);
      inp.disabled = true;
      ck.classList.add('readonly');
      ck.title = '此為報酬節點，自動依據授予任務的完成狀態顯示';
    }
    ck.appendChild(inp);
    headerRow.appendChild(ck);

    const iconEl = document.createElement('span');
    iconEl.className = 'step-icon';
    iconEl.textContent = icon;
    headerRow.appendChild(iconEl);

    const idEl = document.createElement('span');
    idEl.className = 'step-id';
    idEl.textContent = id;
    headerRow.appendChild(idEl);

    const nameEl = document.createElement('span');
    nameEl.className = 'step-name';
    const rawName = t.kind === 'reward' ? `${t.name}（目標）` : t.name;
    if (isDone) {
      const s = document.createElement('s');
      s.textContent = rawName;
      nameEl.appendChild(s);
    } else {
      nameEl.textContent = rawName;
    }
    headerRow.appendChild(nameEl);

    if (isFirstAvail) {
      const hintEl = document.createElement('span');
      hintEl.className = 'planner-start-hint';
      hintEl.textContent = '← 從這裡開始';
      headerRow.appendChild(hintEl);
    }

    if (t.kind === 'task') {
      const tg = document.createElement('button');
      tg.className = 'toggle';
      tg.type = 'button';
      tg.textContent = '▾';
      tg.onclick = e => {
        e.stopPropagation();
        if (li.classList.contains('expanded')) {
          li.classList.remove('expanded');
          return;
        }
        // 延遲建立 details，避免每一步都先建一次（首次展開才建）
        if (!li.querySelector('.details')) {
          const det = document.createElement('div');
          det.className = 'details';
          det.appendChild(makeWikiInfo(t));
          det.appendChild(makePrereqEditor(t));
          det.appendChild(makeNextList(t));
          det.appendChild(makeNotesEditor(t));
          li.appendChild(det);
        }
        li.classList.add('expanded');
      };
      headerRow.appendChild(tg);
    }

    li.appendChild(headerRow);
    ol.appendChild(li);
  });

  ui.plannerBody.appendChild(ol);
}

function populatePlannerSelect() {
  const sel = ui.plannerSelect;
  sel.innerHTML = '<option value="">— 選擇目標任務 —</option>';
  TASKS.filter(t => t.kind === 'task' || t.kind === 'reward').forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = `[${t.id}] ${t.name}`;
    sel.appendChild(opt);
  });
}

// Build lookup maps
const SHIPS_BY_BASE = Object.fromEntries(SHIPS.map(s => [s.base, s]));
// Map: any name (base or any form) -> base ship object
const SHIPS_BY_ANY_NAME = (() => {
  const m = {};
  SHIPS.forEach(s => {
    m[s.base] = s;
    s.forms.forEach(f => { m[f] = s; });
  });
  return m;
})();

// LocalStorage for ships
const SHIPS_STORAGE_KEY = 'kc_ships_v1';
const shipsState = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(SHIPS_STORAGE_KEY)) || {};
    return {
      owned: s.owned || {},         // { base: timestamp } — 主 bucket（base type）的持有
      pinned: s.pinned || {},       // { base: timestamp } — base 級釘選
      foldedTypes: s.foldedTypes || {}, // { typeName: true }
      ownedForms: s.ownedForms || {},   // { exactFormName: timestamp } — alt-bucket / 嚴格 form 的持有，與 owned 獨立
      pinnedForms: s.pinnedForms || {}, // { exactFormName: timestamp } — alt-form 級釘選
    };
  } catch { return { owned: {}, pinned: {}, foldedTypes: {}, ownedForms: {}, pinnedForms: {} }; }
})();
function saveShips() { localStorage.setItem(SHIPS_STORAGE_KEY, JSON.stringify(shipsState)); }

// LocalStorage for area progress (sea-area node completion).
// Keys are "<areaName>::<node>"; value is the timestamp it was checked.
const AREAS_STORAGE_KEY = 'kc_areas_v1';
const areasState = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(AREAS_STORAGE_KEY)) || {};
    return { cleared: s.cleared || {} };
  } catch { return { cleared: {} }; }
})();
function saveAreas() { localStorage.setItem(AREAS_STORAGE_KEY, JSON.stringify(areasState)); }
function areaKey(area, node) { return area + '::' + node; }
function isNodeCleared(area, node) { return !!areasState.cleared[areaKey(area, node)]; }
function areaProgress(area) {
  if (!AREAS || !Array.isArray(AREAS.items)) return { done: 0, total: 0 };
  let done = 0, total = 0;
  for (const it of AREAS.items) {
    if (it.area !== area) continue;
    total++;
    if (isNodeCleared(it.area, it.node)) done++;
  }
  return { done, total };
}

// ship base lookup by any form name
function shipBaseFromName(name) {
  const s = SHIPS_BY_ANY_NAME[name];
  return s ? s.base : null;
}

// 預先計算「哪些 form 是某個 base 的獨立 alt-form」
// e.g. ALT_FORM_TO_BASE = { '大鯨': '龍鳳', '千歳航': '千歳', '千代田航': '千代田' }
const ALT_FORM_TO_BASE = (() => {
  const m = {};
  SHIPS.forEach(s => {
    if (s.alsoIn && Array.isArray(s.alsoIn.forms)) {
      s.alsoIn.forms.forEach(f => { m[f] = s.base; });
    }
  });
  return m;
})();

// Compute sets needed by any incomplete task
// 回傳 { neededBases: Set<base>, neededAltForms: Set<form> }
//   - require_ships → neededBases
//   - require_strict_forms：若 form 是某 ship 的 altForm，加入 neededAltForms（標記 alt row）；
//                          否則加入 neededBases（fallback，會由 base row 顯示）
function computeRequiredShipBases() {
  const neededBases = new Set();
  const neededAltForms = new Set();
  REAL_TASKS.forEach(t => {
    if (state.done[t.id]) return;
    if (Array.isArray(t.require_ships)) {
      t.require_ships.forEach(name => {
        const base = shipBaseFromName(name);
        if (base) neededBases.add(base);
      });
    }
    if (Array.isArray(t.require_strict_forms)) {
      t.require_strict_forms.forEach(form => {
        if (ALT_FORM_TO_BASE[form]) {
          neededAltForms.add(form);
        } else {
          const base = shipBaseFromName(form);
          if (base) neededBases.add(base);
        }
      });
    }
  });
  return { neededBases, neededAltForms };
}

// 由 TASKS 預先計算「哪些 base 有任務指定特定 form」
// e.g. { '龍鳳': Set('大鯨') } 表示 龍鳳 base 之下，'大鯨' form 是某些任務的嚴格需求
const STRICT_FORMS_BY_BASE = (() => {
  const map = {};
  TASKS.forEach(t => {
    if (!Array.isArray(t.require_strict_forms)) return;
    t.require_strict_forms.forEach(form => {
      const base = (SHIPS_BY_ANY_NAME[form] || {}).base;
      if (!base) return;
      (map[base] = map[base] || new Set()).add(form);
    });
  });
  return map;
})();

// Bucket ships by display 艦種 (handles alsoIn cross-type display)
// 兩種 alsoIn 模式：
//   1. alsoIn.from（共享持有，如扶桑改二）：在另一 bucket 顯示同一 base，共用 owned[base]
//   2. alsoIn.forms（獨立持有，如大鯨/千歳航/千代田航）：alt bucket 顯示為獨立 row，使用 ownedForms[altForm]
function shipsByType() {
  const map = {};
  SHIPS_TYPE_LIST().forEach(t => { map[t] = []; });
  SHIPS.forEach(s => {
    (map[s.type] = map[s.type] || []).push({ ship: s, primary: true });
    if (s.alsoIn) {
      const entry = { ship: s, primary: false };
      if (Array.isArray(s.alsoIn.forms) && s.alsoIn.forms.length > 0) {
        entry.altForms = s.alsoIn.forms;
      }
      (map[s.alsoIn.type] = map[s.alsoIn.type] || []).push(entry);
    }
  });
  return map;
}

function SHIPS_TYPE_LIST() {
  // Use SHIP_TYPE_ORDER order, skip empty
  const present = new Set();
  SHIPS.forEach(s => {
    present.add(s.type);
    if (s.alsoIn) present.add(s.alsoIn.type);
  });
  return SHIP_TYPE_ORDER.filter(t => present.has(t));
}

let shipsSearch = '';
let shipsFilter = 'all';

function renderShipsPanel() {
  const list = document.getElementById('ships-list');
  const summaryEl = document.getElementById('ships-summary');
  if (!list || !summaryEl) return;

  // 持有/釘選/總數 都把 alt-form 算進去（它們是獨立可勾選的項目）
  const altFormsAll = Object.keys(ALT_FORM_TO_BASE);
  const ownedCount = Object.keys(shipsState.owned).length + Object.keys(shipsState.ownedForms).filter(f => ALT_FORM_TO_BASE[f]).length;
  const pinnedCount = Object.keys(shipsState.pinned).length + Object.keys(shipsState.pinnedForms).filter(f => ALT_FORM_TO_BASE[f]).length;
  const totalCount = SHIPS.length + altFormsAll.length;
  const { neededBases, neededAltForms } = computeRequiredShipBases();
  const missingNeededBases = [...neededBases].filter(b => !shipsState.owned[b]).length;
  const missingNeededAltForms = [...neededAltForms].filter(f => !shipsState.ownedForms[f]).length;
  const neededTotal = neededBases.size + neededAltForms.size;
  const missingNeeded = missingNeededBases + missingNeededAltForms;

  summaryEl.innerHTML = `
    <span>持有: <b>${ownedCount}</b> / ${totalCount}</span>
    <span>釘選: <b>${pinnedCount}</b></span>
    <span>任務需要: <b>${neededTotal}</b> (缺 ${missingNeeded})</span>
  `;

  const q = shipsSearch.trim().toLowerCase();
  const buckets = shipsByType();
  list.innerHTML = '';

  let totalShownInAll = 0;

  SHIPS_TYPE_LIST().forEach(typeName => {
    const entries = buckets[typeName] || [];
    if (!entries.length) return;

    // Apply filter & search
    const filtered = entries.filter(({ ship, primary, altForms }) => {
      // alt-form 列：持有/釘選/需要 都用 form 級別判定
      const isAlt = Array.isArray(altForms) && altForms.length > 0;
      const altKey = isAlt ? altForms[0] : null;
      const owned = isAlt ? !!shipsState.ownedForms[altKey] : !!shipsState.owned[ship.base];
      const pinned = isAlt ? !!shipsState.pinnedForms[altKey] : !!shipsState.pinned[ship.base];
      const isNeeded = isAlt ? neededAltForms.has(altKey) : neededBases.has(ship.base);

      if (shipsFilter === 'owned' && !owned) return false;
      if (shipsFilter === 'missing' && owned) return false;
      if (shipsFilter === 'pinned' && !pinned) return false;
      if (shipsFilter === 'needed' && !isNeeded) return false;
      if (q) {
        const formsStr = isAlt ? altForms.join(' ') : ship.forms.join(' ');
        const nameStr = isAlt ? altKey : ship.base;
        const haystack = (nameStr + ' ' + ship.cls + ' ' + formsStr).toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });
    if (!filtered.length) return;

    totalShownInAll += filtered.length;

    const bucket = document.createElement('div');
    bucket.className = 'ship-type-bucket';
    bucket.dataset.type = typeName;

    const folded = !!shipsState.foldedTypes[typeName];
    const ownedInType = filtered.filter(e => {
      if (Array.isArray(e.altForms) && e.altForms.length > 0) {
        return !!shipsState.ownedForms[e.altForms[0]];
      }
      return !!shipsState.owned[e.ship.base];
    }).length;

    const header = document.createElement('div');
    header.className = 'ship-type-header';
    header.dataset.action = 'toggle-fold';
    header.innerHTML = `
      <span class="fold-icon">${folded ? '▶' : '▼'}</span>
      <span class="ship-type-name">${typeName}</span>
      <span class="ship-type-count">${ownedInType} / ${filtered.length}</span>
    `;
    bucket.appendChild(header);

    if (!folded) {
      const body = document.createElement('div');
      body.className = 'ship-type-body';

      // Group by class within the type
      const byClass = {};
      filtered.forEach(e => {
        (byClass[e.ship.cls] = byClass[e.ship.cls] || []).push(e);
      });
      // preserve original SHIPS order within each class
      Object.keys(byClass).forEach(cls => {
        const label = document.createElement('div');
        label.className = 'ship-class-label';
        label.textContent = cls;
        body.appendChild(label);
        byClass[cls].forEach(({ ship, primary, altForms }) => {
          body.appendChild(renderShipRow(ship, primary, neededBases, neededAltForms, altForms));
        });
      });

      bucket.appendChild(body);
    }

    list.appendChild(bucket);
  });

  if (totalShownInAll === 0) {
    const empty = document.createElement('div');
    empty.className = 'ships-empty';
    empty.textContent = q || shipsFilter !== 'all' ? '無符合條件的艦娘' : '艦娘清單為空';
    list.appendChild(empty);
  }
}

function renderShipRow(ship, primary, neededBases, neededAltForms, altForms) {
  // alt-form 列：使用 form 級別的持有/釘選/需要狀態，與 base 完全獨立
  const isAlt = Array.isArray(altForms) && altForms.length > 0;
  const altKey = isAlt ? altForms[0] : null;

  const owned = isAlt ? !!shipsState.ownedForms[altKey] : !!shipsState.owned[ship.base];
  const pinned = isAlt ? !!shipsState.pinnedForms[altKey] : !!shipsState.pinned[ship.base];
  const isNeeded = isAlt
    ? (neededAltForms && neededAltForms.has(altKey))
    : (neededBases && neededBases.has(ship.base));

  const row = document.createElement('div');
  row.className = 'ship-row' + (owned ? ' owned' : '') + (isAlt ? ' alt-form' : '');
  if (!owned) row.classList.add('disabled-pin');
  row.dataset.base = ship.base;
  if (isAlt) row.dataset.altForm = altKey;

  // checkbox
  const cb = document.createElement('label');
  cb.className = 'ship-checkbox';
  cb.innerHTML = `<input type="checkbox" data-action="toggle-own" ${owned ? 'checked' : ''}>`;
  row.appendChild(cb);

  // name + forms
  const nameWrap = document.createElement('div');
  nameWrap.className = 'ship-name-wrap';
  const nameEl = document.createElement('div');
  nameEl.className = 'ship-name';
  // alt-form 列：顯示 alt form 名稱（例：'大鯨'、'千歳航'），而不是 base
  let nameHtml = isAlt ? altKey : ship.base;
  if (isAlt) {
    nameHtml += `<span class="ship-cross">≠ ${ship.base}</span>`;
  } else if (!primary) {
    // 共享 alsoIn（如扶桑改二）：保留原本標示
    nameHtml += `<span class="ship-cross">改後 ${ship.type}</span>`;
  }
  if (isNeeded) nameHtml += ' <span class="ship-warning">任務需要</span>';
  nameEl.innerHTML = nameHtml;
  nameWrap.appendChild(nameEl);

  // 顯示這個列對應的 form 鏈
  // - alt-form 列：只顯示 altForms 範圍
  // - 主列（primary，含 alsoIn.forms 拆分的 ship）：顯示 forms 排除 altForms
  // - 共享 alsoIn 或無 alsoIn：顯示完整 forms
  let displayForms = ship.forms;
  if (isAlt) {
    displayForms = altForms;
  } else if (primary && ship.alsoIn && Array.isArray(ship.alsoIn.forms)) {
    const altSet = new Set(ship.alsoIn.forms);
    displayForms = ship.forms.filter(f => !altSet.has(f));
  }
  if (displayForms.length > 1) {
    const forms = document.createElement('div');
    forms.className = 'ship-forms';
    forms.textContent = displayForms.join(' → ');
    nameWrap.appendChild(forms);
  }

  // 若這個 base 有任務指定嚴格 form 但該 form 不是 alt-form（沒有獨立 row），顯示 form picker chips
  // alt-form 列本身不顯示 chip（因為它就是 form 本身）
  if (!isAlt) {
    const strictForms = STRICT_FORMS_BY_BASE[ship.base];
    const altSet = new Set(ship.alsoIn && Array.isArray(ship.alsoIn.forms) ? ship.alsoIn.forms : []);
    const chipsToShow = strictForms ? [...strictForms].filter(f => !altSet.has(f)) : [];
    if (chipsToShow.length > 0) {
      const picker = document.createElement('div');
      picker.className = 'ship-strict-forms';
      picker.title = '部分任務指定特定型態，請勾選實際持有者';
      chipsToShow.forEach(form => {
        const chip = document.createElement('label');
        chip.className = 'ship-form-chip' + (shipsState.ownedForms[form] ? ' on' : '');
        const cbi = document.createElement('input');
        cbi.type = 'checkbox';
        cbi.checked = !!shipsState.ownedForms[form];
        cbi.dataset.action = 'toggle-form';
        cbi.dataset.form = form;
        cbi.dataset.base = ship.base;
        const txt = document.createElement('span');
        txt.textContent = form;
        chip.appendChild(cbi);
        chip.appendChild(txt);
        picker.appendChild(chip);
      });
      nameWrap.appendChild(picker);
    }
  }

  row.appendChild(nameWrap);

  // pin button
  const pinBtn = document.createElement('button');
  pinBtn.className = 'ship-pin-btn' + (pinned ? ' active' : '');
  pinBtn.dataset.action = 'toggle-pin';
  pinBtn.title = '釘選帶到下一輪';
  pinBtn.textContent = pinned ? '📌' : '📍';
  row.appendChild(pinBtn);

  return row;
}

// Event delegation for ships list
function wireShipsEvents() {
  const panel = document.getElementById('ships-panel');
  panel.addEventListener('click', e => {
    const tgt = e.target;
    const action = tgt.dataset.action || tgt.closest('[data-action]')?.dataset.action;
    if (!action) return;

    if (action === 'toggle-fold') {
      const bucket = tgt.closest('.ship-type-bucket');
      if (!bucket) return;
      const type = bucket.dataset.type;
      if (shipsState.foldedTypes[type]) delete shipsState.foldedTypes[type];
      else shipsState.foldedTypes[type] = true;
      saveShips();
      renderShipsPanel();
    } else if (action === 'toggle-own') {
      const row = tgt.closest('.ship-row');
      if (!row) return;
      const altForm = row.dataset.altForm;
      if (altForm) {
        // alt-form 列：與 base 級別完全獨立
        if (shipsState.ownedForms[altForm]) {
          delete shipsState.ownedForms[altForm];
          delete shipsState.pinnedForms[altForm];
        } else {
          shipsState.ownedForms[altForm] = Date.now();
        }
      } else {
        const base = row.dataset.base;
        if (shipsState.owned[base]) {
          delete shipsState.owned[base];
          delete shipsState.pinned[base];
          // 同步清除這個 base 對應的 strict-form 勾選（chip-row 那種，非獨立 alt-form）
          const ship = SHIPS_BY_BASE[base];
          if (ship) {
            const altSet = new Set(ship.alsoIn && Array.isArray(ship.alsoIn.forms) ? ship.alsoIn.forms : []);
            ship.forms.forEach(f => {
              if (!altSet.has(f)) delete shipsState.ownedForms[f];
            });
          }
        } else {
          shipsState.owned[base] = Date.now();
        }
      }
      saveShips();
      renderShipsPanel();
      if (viewMode !== 'ships') render();
    } else if (action === 'toggle-form') {
      const cb = tgt.matches('input[data-action="toggle-form"]') ? tgt : tgt.querySelector('input[data-action="toggle-form"]');
      if (!cb) return;
      const form = cb.dataset.form;
      const base = cb.dataset.base;
      if (shipsState.ownedForms[form]) {
        delete shipsState.ownedForms[form];
      } else {
        shipsState.ownedForms[form] = Date.now();
        // chip-row 的 strict-form 是「base 之下的特定型態」（非 alsoIn 獨立列），
        // 勾選時自動標記 base 為持有（持有任一改型即視為持有 base）
        if (base && !shipsState.owned[base]) shipsState.owned[base] = Date.now();
      }
      saveShips();
      renderShipsPanel();
      if (viewMode !== 'ships') render();
    } else if (action === 'toggle-pin') {
      const row = tgt.closest('.ship-row');
      if (!row) return;
      const altForm = row.dataset.altForm;
      if (altForm) {
        if (!shipsState.ownedForms[altForm]) return; // 未持有不可釘選
        if (shipsState.pinnedForms[altForm]) delete shipsState.pinnedForms[altForm];
        else shipsState.pinnedForms[altForm] = Date.now();
      } else {
        const base = row.dataset.base;
        if (!shipsState.owned[base]) return; // 未持有不可釘選
        if (shipsState.pinned[base]) delete shipsState.pinned[base];
        else shipsState.pinned[base] = Date.now();
      }
      saveShips();
      renderShipsPanel();
    }
  });

  document.getElementById('ships-search').addEventListener('input', e => {
    shipsSearch = e.target.value;
    renderShipsPanel();
  });
  document.getElementById('ships-filter').addEventListener('change', e => {
    shipsFilter = e.target.value;
    renderShipsPanel();
  });
  document.getElementById('ships-expand-all').onclick = () => {
    shipsState.foldedTypes = {};
    saveShips();
    renderShipsPanel();
  };
  document.getElementById('ships-collapse-all').onclick = () => {
    SHIPS_TYPE_LIST().forEach(t => { shipsState.foldedTypes[t] = true; });
    saveShips();
    renderShipsPanel();
  };
  document.getElementById('ships-new-run').onclick = () => {
    const pinnedCount = Object.keys(shipsState.pinned).length + Object.keys(shipsState.pinnedForms).length;
    if (!confirm(`開始新一輪？\n所有「持有」狀態將被清除，僅保留 ${pinnedCount} 艘已釘選艦娘為新一輪初始艦娘。\n(任務勾選不會被影響)`)) return;
    const keepBases = { ...shipsState.pinned };
    const keepForms = { ...shipsState.pinnedForms };
    shipsState.owned = {};
    shipsState.ownedForms = {};
    Object.keys(keepBases).forEach(base => { shipsState.owned[base] = Date.now(); });
    Object.keys(keepForms).forEach(form => { shipsState.ownedForms[form] = Date.now(); });
    // pinned / pinnedForms remain as-is for next-next-run hints
    saveShips();
    renderShipsPanel();
    if (viewMode !== 'ships') render();
  };
}

// Map each viewMode to its parent top-level group + remember last sub-view per group.
const VIEW_GROUP = {
  focus: 'tasks',  all: 'tasks',  planner: 'tasks',
  ships: 'ships',
  builds: 'factory',  developments: 'factory',  improvements: 'factory',
  areas: 'areas',
  expeditions: 'expeditions',
};
const lastInGroup = { tasks: 'focus', factory: 'improvements' };

function groupOf(vm) { return VIEW_GROUP[vm] || 'tasks'; }

function setView() {
  const group = groupOf(viewMode);
  // Top-level tab active state
  ui.vwTasks.classList.toggle('active', group === 'tasks');
  ui.vwShips.classList.toggle('active', group === 'ships');
  ui.vwFactory.classList.toggle('active', group === 'factory');
  ui.vwAreas.classList.toggle('active', group === 'areas');
  ui.vwExpeditions.classList.toggle('active', group === 'expeditions');
  // Sub-tab strips: only show when relevant parent is active
  ui.tasksSubtabs.style.display = group === 'tasks' ? 'flex' : 'none';
  ui.factorySubtabs.style.display = group === 'factory' ? 'flex' : 'none';
  // Sub-tab active state
  ui.vwFocus.classList.toggle('active', viewMode === 'focus');
  ui.vwAll.classList.toggle('active', viewMode === 'all');
  ui.vwPlanner.classList.toggle('active', viewMode === 'planner');
  ui.vwBuilds.classList.toggle('active', viewMode === 'builds');
  ui.vwDevelopments.classList.toggle('active', viewMode === 'developments');
  ui.vwImprovements.classList.toggle('active', viewMode === 'improvements');
  // Old in-view header chips (controls / tabs / typeTabs / tagTabs) only show in 'all' view
  const isList = (viewMode === 'focus' || viewMode === 'all');
  ui.allControls.style.display = viewMode === 'all' ? 'flex' : 'none';
  ui.tabs.style.display = viewMode === 'all' ? 'flex' : 'none';
  ui.typeTabs.style.display = viewMode === 'all' ? 'flex' : 'none';
  if (ui.tagTabs) ui.tagTabs.style.display = viewMode === 'all' ? 'flex' : 'none';
  // Panel visibility
  ui.list.style.display = isList ? '' : 'none';
  ui.planner.style.display = viewMode === 'planner' ? '' : 'none';
  ui.shipsPanel.style.display = viewMode === 'ships' ? '' : 'none';
  ui.improvementsPanel.style.display = viewMode === 'improvements' ? '' : 'none';
  ui.areasPanel.style.display = viewMode === 'areas' ? '' : 'none';
  ui.expeditionsPanel.style.display = viewMode === 'expeditions' ? '' : 'none';
  ui.buildsPanel.style.display = viewMode === 'builds' ? '' : 'none';
  ui.developmentsPanel.style.display = viewMode === 'developments' ? '' : 'none';
  // Remember sub-view per group for next time user clicks the parent.
  if (group === 'tasks' || group === 'factory') lastInGroup[group] = viewMode;
}

function switchTo(vm) {
  viewMode = vm;
  setView();
  // Dispatch to the appropriate renderer.
  switch (vm) {
    case 'focus': case 'all':   render(); break;
    case 'planner':              render(); break;
    case 'ships':                renderShipsPanel(); break;
    case 'improvements':         renderImprovements(); break;
    case 'areas':                renderAreas(); break;
    case 'expeditions':          renderExpeditions(); break;
    case 'builds':               renderBuilds(); break;
    case 'developments':         renderDevelopments(); break;
  }
}

// Parent top-level tab clicks: switch to remembered sub-view (or default).
ui.vwTasks.onclick    = () => switchTo(lastInGroup.tasks    || 'focus');
ui.vwShips.onclick    = () => switchTo('ships');

// === 改修工廠 (Improvements view) ===
let activeImpCategory = 'all';

function getImprovementCategories() {
  const seen = new Set();
  const order = [];
  for (const it of (IMPROVEMENTS && IMPROVEMENTS.items ? IMPROVEMENTS.items : [])) {
    if (!seen.has(it.category)) { seen.add(it.category); order.push(it.category); }
  }
  return order;
}

function renderImprovementsCatTabs() {
  const cats = getImprovementCategories();
  const total = (IMPROVEMENTS && IMPROVEMENTS.items) ? IMPROVEMENTS.items.length : 0;
  const tabs = [{ key: 'all', label: '全部', count: total }];
  for (const c of cats) {
    const count = IMPROVEMENTS.items.filter(it => it.category === c).length;
    tabs.push({ key: c, label: c, count });
  }
  ui.impCatTabs.innerHTML = tabs.map(t => {
    const active = t.key === activeImpCategory ? ' active' : '';
    return `<button class="imp-tab${active}" data-cat="${t.key}">${t.label} <span style="opacity:0.65">${t.count}</span></button>`;
  }).join('');
}

function renderImprovements() {
  if (!IMPROVEMENTS || !Array.isArray(IMPROVEMENTS.items)) {
    ui.impList.innerHTML = '<div class="imp-empty">改修資料未載入</div>';
    return;
  }
  // Note message (data source + review reminder)
  if (IMPROVEMENTS.note) {
    ui.impNote.textContent = IMPROVEMENTS.note;
    ui.impNote.style.display = '';
  } else {
    ui.impNote.style.display = 'none';
  }

  const q = (ui.impSearch.value || '').trim().toLowerCase();
  const items = IMPROVEMENTS.items.filter(it => {
    if (activeImpCategory !== 'all' && it.category !== activeImpCategory) return false;
    if (!q) return true;
    if (it.name && it.name.toLowerCase().includes(q)) return true;
    if (it.updates_to && it.updates_to.toLowerCase().includes(q)) return true;
    if (Array.isArray(it.secretary)) {
      for (const s of it.secretary) {
        if (s && s.toLowerCase().includes(q)) return true;
      }
    }
    if (it.required_equipment && it.required_equipment.toLowerCase().includes(q)) return true;
    return false;
  });

  if (items.length === 0) {
    ui.impList.innerHTML = '<div class="imp-empty">沒有符合條件的裝備</div>';
    return;
  }

  // Group by category preserving order from IMPROVEMENTS.items.
  const groups = new Map();
  for (const it of items) {
    if (!groups.has(it.category)) groups.set(it.category, []);
    groups.get(it.category).push(it);
  }

  const escape = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  // Auto-expand when: searching, or filtered to a single category, or user expanded it manually.
  const autoExpand = !!q || activeImpCategory !== 'all';

  const html = [];
  for (const [cat, list] of groups.entries()) {
    const isExpanded = autoExpand || IMP_EXPANDED.has(cat);
    const sectionCls = 'area-group' + (isExpanded ? ' expanded' : '');
    html.push(`<div class="${sectionCls}" data-cat="${escape(cat)}">`);
    html.push(`<div class="area-group-head" data-toggle="${escape(cat)}"><span>${escape(cat)} <span style="color:var(--text-dim);font-weight:normal;font-size:11px">(${list.length} 項)</span></span><span class="area-toggle">▼</span></div>`);
    html.push(`<div class="area-group-body">`);
    for (const it of list) {
      const terminal = it.updates_to === '更新不可' || !it.updates_to;
      const cardClass = 'imp-card' + (terminal ? ' terminal' : '');
      const updatesClass = 'imp-updates-to' + (terminal ? ' terminal' : '');
      const secretaryHtml = (Array.isArray(it.secretary) && it.secretary.length)
        ? it.secretary.map(s => `<span class="imp-sec-chip">${escape(s)}</span>`).join('')
        : '<span class="imp-card-value" style="color:var(--text-dim)">なし</span>';
      const reqHtml = it.required_equipment
        ? escape(it.required_equipment)
        : '<span style="color:var(--text-dim)">なし</span>';
      const updatesHtml = terminal
        ? '更新不可'
        : escape(it.updates_to);
      const notesHtml = it.notes
        ? `<div class="imp-card-row"><span class="imp-card-label">備考</span><span class="imp-card-value">${escape(it.notes)}</span></div>`
        : '';
      html.push(`<div class="${cardClass}">`);
      html.push(`<div class="imp-card-name">${escape(it.name)}</div>`);
      html.push(`<div class="imp-card-row"><span class="imp-card-label">秘書艦</span><div class="imp-secretary-list">${secretaryHtml}</div></div>`);
      html.push(`<div class="imp-card-row"><span class="imp-card-label">必要装備</span><span class="imp-card-value">${reqHtml}</span></div>`);
      html.push(`<div class="imp-card-row"><span class="imp-card-label">改修後</span><span class="imp-card-value"><span class="imp-arrow">→</span> <span class="${updatesClass}">${updatesHtml}</span></span></div>`);
      html.push(notesHtml);
      html.push(`</div>`);
    }
    html.push(`</div></div>`);
  }
  ui.impList.innerHTML = html.join('');
}

const IMP_EXPANDED = new Set();  // category names currently expanded (only used when activeImpCategory==='all' and no search)

ui.impSearch.addEventListener('input', () => renderImprovements());
ui.impCatTabs.addEventListener('click', e => {
  const btn = e.target.closest('.imp-tab');
