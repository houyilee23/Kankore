// === 海域 (Areas view) ===
const AREA_EXPANDED = new Set();  // area names currently expanded

function renderAreas() {
  if (!AREAS || !Array.isArray(AREAS.items)) {
    ui.areaList.innerHTML = '<div class="imp-empty">海域資料未載入</div>';
    return;
  }
  if (AREAS.note) {
    ui.areaNote.textContent = AREAS.note;
    ui.areaNote.style.display = '';
  } else {
    ui.areaNote.style.display = 'none';
  }

  const q = (ui.areaSearch.value || '').trim().toLowerCase();
  const matches = it => {
    if (!q) return true;
    const haystack = [
      it.area, String(it.node),
      it.fleet_flag, it.fleet_escort, it.nav_flag, it.nav_escort,
      it.notes, it.recon, it.restricted,
      ...(it.tasks || [])
    ].join(' ').toLowerCase();
    return haystack.includes(q);
  };

  const filtered = AREAS.items.filter(matches);
  // Group by area, preserving the canonical order in AREAS.areas
  const groups = new Map();
  for (const a of AREAS.areas) groups.set(a, []);
  for (const it of filtered) {
    if (!groups.has(it.area)) groups.set(it.area, []);
    groups.get(it.area).push(it);
  }

  const escape = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  // Auto-expand groups when searching (matches make context useful)
  const autoExpand = !!q;

  const html = [];
  let renderedAny = false;
  for (const [area, nodes] of groups.entries()) {
    if (nodes.length === 0) continue;
    renderedAny = true;
    const isExpanded = autoExpand || AREA_EXPANDED.has(area);
    const cls = 'area-group' + (isExpanded ? ' expanded' : '');
    const prog = areaProgress(area);
    const progLabel = prog.total > 0 ? `${prog.done}/${prog.total}` : '';
    const progDone = prog.total > 0 && prog.done === prog.total;
    const progClass = progDone ? 'area-prog area-prog-done' : 'area-prog';
    html.push(`<div class="${cls}" data-area="${escape(area)}">`);
    html.push(`<div class="area-group-head" data-toggle="${escape(area)}"><span>${escape(area)} <span class="${progClass}">${progLabel}</span></span><span class="area-toggle">▼</span></div>`);
    html.push(`<div class="area-group-body">`);
    for (const it of nodes) {
      const cleared = isNodeCleared(it.area, it.node);
      const nodeCls = 'area-node' + (cleared ? ' cleared' : '');
      html.push(`<div class="${nodeCls}">`);
      // Head row: checkbox + 第 N 區
      html.push(`<div class="area-node-headrow">`);
      html.push(`<label class="area-check" data-cleared-area="${escape(it.area)}" data-cleared-node="${it.node}"><input type="checkbox" ${cleared ? 'checked' : ''}></label>`);
      html.push(`<div class="area-node-head">第 ${it.node} 區${cleared ? ' <span class="area-cleared-tag">✓ 已通過</span>' : ''}</div>`);
      html.push(`</div>`);
      // 解放條件 (per-node unlock, e.g. "中部西海域:第二作戦海域クリアで出撃可能" or 難易度甲以上)
      if (it.unlock) {
        html.push(`<div class="area-row"><span class="area-row-label">解放條件</span><span class="area-row-value area-unlock">🔒 ${escape(it.unlock)}</span></div>`);
      }
      // 建議編成
      if (it.fleet_flag || it.fleet_escort) {
        const flag = it.fleet_flag ? `<span class="area-fleet-flag">旗艦:${escape(it.fleet_flag)}</span> ` : '';
        const esc  = it.fleet_escort ? `<span class="area-fleet-escort">${escape(it.fleet_escort)}</span>` : '';
        html.push(`<div class="area-row"><span class="area-row-label">建議編成</span><span class="area-row-value">${flag}${esc}</span></div>`);
      }
      // 必要導航
      if (it.nav_flag || it.nav_escort) {
        const flag = it.nav_flag ? `<span class="area-fleet-flag">旗艦:${escape(it.nav_flag)}</span> ` : '';
        const esc  = it.nav_escort ? `<span class="area-fleet-escort">${escape(it.nav_escort)}</span>` : '';
        html.push(`<div class="area-row"><span class="area-row-label">必要導航</span><span class="area-row-value">${flag}${esc}</span></div>`);
      }
      if (it.notes) {
        html.push(`<div class="area-row"><span class="area-row-label">注意事項</span><span class="area-row-value area-notes">${escape(it.notes)}</span></div>`);
      }
      if (it.recon) {
        html.push(`<div class="area-row"><span class="area-row-label">索敵裝備</span><span class="area-row-value area-recon">${escape(it.recon)}</span></div>`);
      }
      if (it.restricted) {
        html.push(`<div class="area-row"><span class="area-row-label">出擊不可</span><span class="area-row-value area-restricted">${escape(it.restricted)}</span></div>`);
      }
      if (Array.isArray(it.tasks) && it.tasks.length) {
        const chips = it.tasks.map(t => `<span class="area-task-chip">${escape(t)}</span>`).join('');
        html.push(`<div class="area-row"><span class="area-row-label">任務相關</span><span class="area-row-value">${chips}</span></div>`);
      }
      html.push(`</div>`);
    }
    html.push(`</div></div>`);
  }
  if (!renderedAny) {
    ui.areaList.innerHTML = '<div class="imp-empty">沒有符合條件的海域</div>';
    return;
  }
  ui.areaList.innerHTML = html.join('');
}

ui.areaSearch.addEventListener('input', () => renderAreas());
ui.areaList.addEventListener('click', e => {
  // If user clicked inside the checkbox label, ignore here; change handler picks it up.
  if (e.target.closest('.area-check')) return;
  const head = e.target.closest('.area-group-head');
  if (!head) return;
  const area = head.dataset.toggle;
  if (!area) return;
  if (AREA_EXPANDED.has(area)) AREA_EXPANDED.delete(area);
  else AREA_EXPANDED.add(area);
  const group = head.closest('.area-group');
  if (group) group.classList.toggle('expanded');
});
ui.areaList.addEventListener('change', e => {
  if (e.target.type !== 'checkbox') return;
  const label = e.target.closest('.area-check');
  if (!label) return;
  const area = label.dataset.clearedArea;
  const node = label.dataset.clearedNode;
  if (!area || !node) return;
  const key = areaKey(area, node);
  if (e.target.checked) areasState.cleared[key] = Date.now();
  else delete areasState.cleared[key];
  saveAreas();
  // Re-render so the group progress count + node 'cleared' class refresh.
  // Preserve current expanded set so the user doesn't lose context.
  renderAreas();
});

// === 遠征 (Expeditions view) ===
const EXP_EXPANDED = new Set();

function renderExpeditions() {
  if (!EXPEDITIONS || !Array.isArray(EXPEDITIONS.items)) {
    ui.expList.innerHTML = '<div class="imp-empty">遠征資料未載入</div>';
    return;
  }
  if (EXPEDITIONS.note) {
    ui.expNote.textContent = EXPEDITIONS.note;
    ui.expNote.style.display = '';
  } else {
    ui.expNote.style.display = 'none';
  }

  const q = (ui.expSearch.value || '').trim().toLowerCase();
  const sortMode = ui.expSort.value || 'id';
  const matches = it => {
    if (!q) return true;
    const haystack = [
      it.area, String(it.id), it.name, it.fleet, it.appear_cond, it.notes
    ].join(' ').toLowerCase();
    return haystack.includes(q);
  };

  const filtered = EXPEDITIONS.items.filter(matches);
  const groups = new Map();
  for (const a of EXPEDITIONS.areas) groups.set(a, []);
  for (const it of filtered) {
    if (!groups.has(it.area)) groups.set(it.area, []);
    groups.get(it.area).push(it);
  }

  const sortFn = {
    'id':         (a, b) => a.id - b.id,
    'score-desc': (a, b) => (b.weighted_score || 0) - (a.weighted_score || 0),
    'days-asc':   (a, b) => a.days - b.days,
    'days-desc':  (a, b) => b.days - a.days,
  }[sortMode] || ((a, b) => a.id - b.id);
  for (const list of groups.values()) list.sort(sortFn);

  const escape = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  const autoExpand = !!q;

  const resCell = (label, value, cls) => {
    const v = Number(value) || 0;
    const zero = v === 0 ? ' zero' : '';
    return `<span class="exp-res ${cls}${zero}">${label} ${v}</span>`;
  };

  // Build one card (used by both the pinned top-5 and the area groups).
  // showArea=true adds an area badge in the head (used for the cross-area pinned list).
  const buildCard = (it, showArea) => {
    const out = [];
    out.push(`<div class="exp-card">`);
    const areaTag = showArea ? `<span class="exp-area-tag">${escape(it.area)}</span>` : '';
    out.push(`<div class="exp-card-head"><span><span class="exp-id-chip">#${it.id}</span>${areaTag}<span class="exp-name">${escape(it.name)}</span></span><span><span class="exp-meta-chip">${it.days} 日</span> <span class="exp-meta-chip">XP ${it.xp}</span> ${it.weighted_score ? `<span class="exp-score-chip">加權 ${it.weighted_score}</span>` : ''}</span></div>`);
    const r = it.rewards || {};
    out.push(`<div class="exp-row"><span class="exp-row-label">日給</span><span class="exp-rewards-grid">${resCell('燃', r.fuel, 'exp-res-fuel')}${resCell('弾', r.ammo, 'exp-res-ammo')}${resCell('鋼', r.steel, 'exp-res-steel')}${resCell('ボ', r.bauxite, 'exp-res-bauxite')}${resCell('戦P', r.strategy_p, 'exp-res-sp')}</span></div>`);
    const items = it.items || {};
    const itemChips = [];
    if (items.dev)       itemChips.push(`<span class="exp-item-chip">開發 ${escape(items.dev)}</span>`);
    if (items.construct) itemChips.push(`<span class="exp-item-chip">建造 ${escape(items.construct)}</span>`);
    if (items.repair)    itemChips.push(`<span class="exp-item-chip">修復 ${escape(items.repair)}</span>`);
    if (items.furniture) itemChips.push(`<span class="exp-item-chip">家具 ${escape(items.furniture)}</span>`);
    if (itemChips.length) {
      out.push(`<div class="exp-row"><span class="exp-row-label">出現物品</span><span class="exp-items-grid">${itemChips.join('')}</span></div>`);
    }
    if (it.fleet) {
      out.push(`<div class="exp-row"><span class="exp-row-label">編成</span><span class="exp-row-value">${escape(it.fleet)}</span></div>`);
    }
    const lvParts = [];
    if (it.flagship_lv) lvParts.push(`旗艦 Lv.${escape(it.flagship_lv)}`);
    if (it.total_lv)    lvParts.push(`隊伍合計 Lv.${escape(it.total_lv)}`);
    if (lvParts.length) {
      out.push(`<div class="exp-row"><span class="exp-row-label">Lv 要求</span><span class="exp-row-value">${lvParts.join(' / ')}</span></div>`);
    }
    if (it.appear_cond) {
      out.push(`<div class="exp-row"><span class="exp-row-label">出現條件</span><span class="exp-row-value exp-cond">${escape(it.appear_cond)}</span></div>`);
    }
    if (it.notes) {
      out.push(`<div class="exp-row"><span class="exp-row-label">備註</span><span class="exp-row-value exp-cond">${escape(it.notes)}</span></div>`);
    }
    out.push(`</div>`);
    return out.join('');
  };

  // === Pinned: Top-5 by weighted_score (across all areas, independent of search/sort) ===
  const topPinned = EXPEDITIONS.items
    .filter(it => (it.weighted_score || 0) > 0)
    .slice()
    .sort((a, b) => (b.weighted_score || 0) - (a.weighted_score || 0))
    .slice(0, 5);

  const html = [];
  if (topPinned.length) {
    html.push(`<div class="exp-pinned-section">`);
    html.push(`<div class="exp-pinned-head">🏆 加權分 Top ${topPinned.length} <span class="exp-pinned-hint">(跨海域，固定置頂；不受搜尋/排序/摺疊影響)</span></div>`);
    for (const it of topPinned) {
      html.push(buildCard(it, /* showArea = */ true));
    }
    html.push(`</div>`);
  }

  let renderedAny = false;
  for (const [area, exps] of groups.entries()) {
    if (exps.length === 0) continue;
    renderedAny = true;
    const isExpanded = autoExpand || EXP_EXPANDED.has(area);
    const cls = 'area-group' + (isExpanded ? ' expanded' : '');
    html.push(`<div class="${cls}" data-area="${escape(area)}">`);
    html.push(`<div class="area-group-head" data-toggle="${escape(area)}"><span>${escape(area)} <span style="color:var(--text-dim);font-weight:normal;font-size:11px">(${exps.length} 個遠征)</span></span><span class="area-toggle">▼</span></div>`);
    html.push(`<div class="area-group-body">`);
    for (const it of exps) html.push(buildCard(it, /* showArea = */ false));
    html.push(`</div></div>`);
  }
  if (!renderedAny && !topPinned.length) {
    ui.expList.innerHTML = '<div class="imp-empty">沒有符合條件的遠征</div>';
    return;
  }
  ui.expList.innerHTML = html.join('');
}

ui.expSearch.addEventListener('input', () => renderExpeditions());
ui.expSort.addEventListener('change', () => renderExpeditions());
ui.expList.addEventListener('click', e => {
  const head = e.target.closest('.area-group-head');
  if (!head) return;
  const area = head.dataset.toggle;
  if (!area) return;
  if (EXP_EXPANDED.has(area)) EXP_EXPANDED.delete(area);
  else EXP_EXPANDED.add(area);
  const group = head.closest('.area-group');
  if (group) group.classList.toggle('expanded');
});
ui.expExpandAll.onclick = () => {
  for (const a of (EXPEDITIONS.areas || [])) EXP_EXPANDED.add(a);
  renderExpeditions();
};
ui.expCollapseAll.onclick = () => {
  EXP_EXPANDED.clear();
  ui.expSearch.value = '';
  renderExpeditions();
};

// === 建造 (Builds view) ===
const BUILD_EXPANDED = new Set();

function renderBuilds() {
  if (!BUILDS || !Array.isArray(BUILDS.recipes)) {
    ui.buildList.innerHTML = '<div class="imp-empty">建造資料未載入</div>';
    return;
  }
  if (BUILDS.note) { ui.buildNote.textContent = BUILDS.note; ui.buildNote.style.display = ''; }
  else { ui.buildNote.style.display = 'none'; }

  const escape = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  // ----- 建造日数 table (top) -----
  const durHtml = [];
  durHtml.push('<div class="build-duration-table">');
  durHtml.push('<div class="build-duration-head">⏱ 建造日数表</div>');
  for (const d of (BUILDS.durations || [])) {
    durHtml.push('<div class="build-duration-row">');
    durHtml.push(`<span class="build-duration-days">${d.days} 日</span>`);
    durHtml.push(`<span class="build-duration-ships">${escape(d.ships)}<span class="build-duration-summary">${escape(d.summary)}</span></span>`);
    durHtml.push('</div>');
  }
  durHtml.push('</div>');
  ui.buildDurationSection.innerHTML = durHtml.join('');

  // ----- 配方 grouped by 艦種 -----
  const q = (ui.buildSearch.value || '').trim().toLowerCase();
  const matches = r => {
    if (!q) return true;
    const bag = [r.category, r.target, r.notes].join(' ').toLowerCase();
    return bag.includes(q);
  };
  const filtered = BUILDS.recipes.filter(matches);
  const groups = new Map();
  for (const c of (BUILDS.categories || [])) groups.set(c, []);
  for (const r of filtered) {
    if (!groups.has(r.category)) groups.set(r.category, []);
    groups.get(r.category).push(r);
  }

  const autoExpand = !!q;
  const resCell = (label, value, cls) => {
    const v = Number(value) || 0;
    const zero = v === 0 ? ' zero' : '';
    return `<span class="exp-res ${cls}${zero}">${label} ${v}</span>`;
  };

  const html = [];
  let renderedAny = false;
  for (const [cat, recipes] of groups.entries()) {
    if (recipes.length === 0) continue;
    renderedAny = true;
    const isExpanded = autoExpand || BUILD_EXPANDED.has(cat);
    const cls = 'area-group' + (isExpanded ? ' expanded' : '');
    html.push(`<div class="${cls}" data-cat="${escape(cat)}">`);
    html.push(`<div class="area-group-head" data-toggle="${escape(cat)}"><span>${escape(cat)} <span style="color:var(--text-dim);font-weight:normal;font-size:11px">(${recipes.length} 個配方)</span></span><span class="area-toggle">▼</span></div>`);
    html.push('<div class="area-group-body">');
    for (const r of recipes) {
      html.push('<div class="recipe-card">');
      html.push(`<div class="recipe-target">🎯 ${escape(r.target)}</div>`);
      html.push('<div class="recipe-cost">');
      html.push(resCell('燃', r.fuel,    'exp-res-fuel'));
      html.push(resCell('弾', r.ammo,    'exp-res-ammo'));
      html.push(resCell('鋼', r.steel,   'exp-res-steel'));
      html.push(resCell('ボ', r.bauxite, 'exp-res-bauxite'));
      if (r.strategy_p) html.push(resCell('戦P', r.strategy_p, 'exp-res-sp'));
      html.push('</div>');
      if (r.notes) html.push(`<div class="recipe-notes">${escape(r.notes)}</div>`);
      html.push('</div>');
    }
    html.push('</div></div>');
  }
  ui.buildList.innerHTML = renderedAny ? html.join('') : '<div class="imp-empty">沒有符合條件的配方</div>';
}

ui.buildSearch.addEventListener('input', () => renderBuilds());
ui.buildList.addEventListener('click', e => {
  const head = e.target.closest('.area-group-head');

};
